<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
<rect width="1100" height="620" fill="white"/>
<text x="550" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold">FPGA-Based UART Transceiver — Block Diagram</text>

<rect x="60" y="120" width="210" height="110" rx="12" fill="none" stroke="black" stroke-width="2"/>
<text x="165" y="155" text-anchor="middle" font-family="Arial" font-size="21" font-weight="bold">PC / Terminal</text>
<text x="165" y="188" text-anchor="middle" font-family="Arial" font-size="16">USB-UART interface</text>
<text x="165" y="212" text-anchor="middle" font-family="Arial" font-size="16">Serial data</text>

<rect x="430" y="90" width="240" height="150" rx="12" fill="none" stroke="black" stroke-width="2"/>
<text x="550" y="125" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">UART Transceiver</text>
<text x="550" y="160" text-anchor="middle" font-family="Arial" font-size="17">TX + RX FSMs</text>
<text x="550" y="187" text-anchor="middle" font-family="Arial" font-size="17">Baud-rate divider</text>
<text x="550" y="214" text-anchor="middle" font-family="Arial" font-size="17">Parity / framing checks</text>

<rect x="430" y="330" width="240" height="120" rx="12" fill="none" stroke="black" stroke-width="2"/>
<text x="550" y="365" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">FPGA</text>
<text x="550" y="397" text-anchor="middle" font-family="Arial" font-size="17">Artix-7 / Basys 3</text>
<text x="550" y="424" text-anchor="middle" font-family="Arial" font-size="17">System clock + reset</text>

<rect x="830" y="330" width="210" height="120" rx="12" fill="none" stroke="black" stroke-width="2"/>
<text x="935" y="365" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold">Simulation</text>
<text x="935" y="397" text-anchor="middle" font-family="Arial" font-size="17">Self-checking TB</text>
<text x="935" y="424" text-anchor="middle" font-family="Arial" font-size="17">VCD waveform</text>

<line x1="270" y1="165" x2="430" y2="165" stroke="black" stroke-width="3"/>
<polygon points="430,165 414,157 414,173" fill="black"/>
<text x="350" y="150" text-anchor="middle" font-family="Arial" font-size="15">UART RX</text>

<line x1="670" y1="195" x2="830" y2="195" stroke="black" stroke-width="3"/>
<polygon points="830,195 814,187 814,203" fill="black"/>
<text x="750" y="180" text-anchor="middle" font-family="Arial" font-size="15">UART TX</text>

<line x1="550" y1="240" x2="550" y2="330" stroke="black" stroke-width="3"/>
<polygon points="550,330 542,314 558,314" fill="black"/>

<line x1="670" y1="390" x2="830" y2="390" stroke="black" stroke-width="3"/>
<polygon points="830,390 814,382 814,398" fill="black"/>
<text x="750" y="375" text-anchor="middle" font-family="Arial" font-size="15">RTL verification</text>

<text x="550" y="520" text-anchor="middle" font-family="Arial" font-size="17">Data path: serial bits → sampling → byte reconstruction → validated data</text>
<text x="550" y="550" text-anchor="middle" font-family="Arial" font-size="17">Configurable parameters: clock frequency, baud rate, parity mode</text>
</svg>
